# PostgreSQL untuk pengembangan lokal dan test.
# Port host 5434 agar tidak bentrok dengan instance PostgreSQL lain di mesin pengembang.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: perpustakaan
      POSTGRES_PASSWORD: perpustakaan
      POSTGRES_DB: perpustakaan
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perpustakaan -d perpustakaan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
